<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <script>
    /*import * as maplibregl from 'https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js';*/
    const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);
      
    const map = new maplibregl.Map({
      container: 'map',
      style: 'maputnik-basemap-elev.json',        // the file you downloaded from Maputnik
      center: [-127.5, 54.5],    // longitude, latitude
      zoom: 4.6
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
