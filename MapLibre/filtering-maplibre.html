<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>GEOS 472: MapLibre Filtering Exercise</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <style>
       body #legend {
          position: fixed;
          top: 15px;
          left: 15px;
          width: 140px;
          background-color: #F7F7F7;
          padding: 8px;
          border-radius: 5px;
          z-index: 1000;
          font-family: system-ui;
          font-size: small;
      }
      h4 {
        margin-top: 1px;
        margin-bottom: 5px;
      }
    </style>
  </head>
  
  <body>
    <div id="legend">
      <h4>UBC Places of Interest by Service Type</h4>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #79c44b; display: inline-block"></span>garden</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #595157; display: inline-block"></span>plaza</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #ebeb00; display: inline-block"></span>child_care</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #ffcceb; display: inline-block"></span>restaurant</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #eba400; display: inline-block"></span>commercial_services</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #0099eb; display: inline-block"></span>campus_services</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #eb00ac; display: inline-block"></span>attraction</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #1d2da1; display: inline-block"></span>library</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #f5c402; display: inline-block"></span>cafe</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #4b02f5; display: inline-block"></span>academic</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #02f5bc; display: inline-block"></span>retail</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #5bf502; display: inline-block"></span>grocery</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #73c7b7; display: inline-block"></span>housing_student</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #eb1700; display: inline-block"></span>medical</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #a61717; display: inline-block"></span>hospital</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #006607; display: inline-block"></span>park</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #01004D; display: inline-block"></span>bank</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #b1ff8a; display: inline-block"></span>field</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #762a83; display: inline-block"></span>sub_building</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #908aff; display: inline-block"></span>worship</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #ff36f8; display: inline-block"></span>athletics</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #9e0089; display: inline-block"></span>school</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #ff9a00; display: inline-block"></span>transit</div>
      <div><span style="width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background-color: #00e5ff; display: inline-block"></span>monument</div>
    </div>

    <div id="mapid" style="width: 700px; height: 575px;"></div>
    <div id="controls" style="margin: 10px;">
      <button id="showAllPoiButton">Show All Places of Interest </button>

      <span style="display: inline-block; width: 10px;"></span>
      <input type="text" id="highlightPoiTextEntry" placeholder="e.g. cafe, garden">
      <span style="display: inline-block; width: 10px;"></span>
      <button id="highlightPoiButton">Highlight POI by Service Type</button>
    </div>

    <script type="module">

      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      const map = new maplibregl.Map({
        container: 'mapid',             // the id of the div above
        center: [-123.252, 49.2635],    // [longitude, latitude]
        zoom: 13,
        style: 'https://tiles.openfreemap.org/styles/positron' 
      });

      const mapLegend = {
        container: 'legend'
      };

      window.map = map;

      const url = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/master/ubcv/locations/geojson/ubcv_poi.geojson';

      const poiPaint = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2, 17, 6],
        'circle-color': ['match', ['get', 'SERVICE_TYPE'],
                         'garden', '#79C44B',
                         'plaza', '#595157',
                         'child_care', '#EBEB00',
                         'restaurant', '#EB0047',
                         'commercial_services', '#EBA400',
                         'campus_services', '#0099EB',
                         'attraction', '#EB00AC',
                         'library', '#1D2DA1',
                         'cafe', '#F5C402',
                         'academic', '#4B02F5',
                         'retail', '#02F5BC',
                         'grocery', '#5BF502',
                         'housing_student', '#73C7B7',
                         'medical', '#EB1700',
                         'hospital', '#762a83',
                         'park', '#006607',
                         'bank', '#01004D',
                         'field', '#B1FF8A',
                         'sub_building', '#762a83',
                         'worship', '#908AFF',
                         'athletics', '#64009E',
                         'school', '#9E0089',
                         'transit', '#FF9A00',
                         'monument', '#00E5FF',
                         '#999999'],
        'circle-opacity': 0.6
      };


      function onEachPoi(e) {
        // poi holds that feature's attributes, such as SERVICE_TYPE.
        const poi = e.features[0].properties;
        // Does this poi have a SERVICE_TYPE? If it does not, no popup opens.
        if (poi.PLACENAME) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(poi.PLACENAME);
          popup.addTo(map);
        }
      }
      function addPoi() {
        if (map.getSource('poi')) {
          return;   
        }

        map.addSource('poi', {
          type: 'geojson',
          data: url,
          attribution: 'Places of Interest: UBC POI, UBCGeodata'
        });

        map.addLayer({
          id: 'poi-circles',
          type: 'circle',
          source: 'poi',
          paint: poiPaint
        });
 
        map.on('click', 'poi-circles', onEachPoi);
      }

      function showAllPoi() {
        addPoi();
        map.setFilter('poi-circles', null);
        map.setPaintProperty('poi-circles', 'circle-color', poiPaint['circle-color']);
        map.setPaintProperty('poi-circles', 'circle-opacity', poiPaint['circle-opacity']);
        map.setPaintProperty('poi-circles', 'circle-radius', poiPaint['circle-radius', 2]);
      }

      function highlightPoi() {
        addPoi();
        const textEntry = document.getElementById('highlightPoiTextEntry');
        const serviceToHighlight = textEntry.value;
        if (serviceToHighlight === '') {
          showAllPoi();
          return;
        }
        
        map.setFilter('poi-circles', ['in', serviceToHighlight, ['get', 'SERVICE_TYPE']]);
        map.setPaintProperty('poi-circles', 'circle-color', '#FF0080');
        map.setPaintProperty('poi-circles', 'circle-opacity', 0.9);
        map.setPaintProperty('poi-circles', 'circle-radius', 6);
      }

      map.on('load', function () {
        
        const showAllButton = document.getElementById('showAllPoiButton');
        showAllButton.addEventListener('click', showAllPoi);
        const highlightButton = document.getElementById('highlightPoiButton');
        highlightButton.addEventListener('click', highlightPoi);
      });
    </script>
  </body>
</html>
