<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>Add a little info via interactivity…</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
  </head>
  
  <body>
    <!-- The web map will go in this div element. -->
    <div id="mapid" style="width: 600px; height: 400px;"></div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      // Make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.252, 49.2635],    // [longitude, latitude]
        zoom: 13,
        style: 'https://tiles.openfreemap.org/styles/positron'   // a ready-made style from OpenFreeMap
      });

      // A module keeps its names to itself. This line lets you type map in the browser's console.
      window.map = map;

      // The raw URL of the UBC Campus Trees file on GitHub.
      const url = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/master/ubcv/locations/geojson/ubcv_poi.geojson';

      // Paint properties set how the layer draws each circle.
      // They are kept in a variable, poiPaint, as they will be in next Tuesday's sketches.
      
      const poiPaint = {
        // A zoom expression: the radius depends on the map's zoom (as in step 8).
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2, 17, 6],
        // A data-driven expression: the colour depends on each poi's SERVICE_TYPE value.
        // Any other value, or no value, gives grey.
        'circle-color': ['match', ['get', 'SERVICE_TYPE'],
                         'garden', '#79C44B',
                         'plaza', '#595157',
                         'child_care', '#EBEB00',
                         'restaurant', '#EB0047',
                         'commercial_services', '#EBA400',
                         'campus_services', '#0099EB',
                         'attraction', '#EB00AC',
                         'library', '#1D2DA1',
                         'cafe', '#F5C402',
                         'academic', '#4B02F5',
                         'retail', '#02F5BC',
                         'grocery', '#5BF502',
                         'housing_student', '#73C7B7',
                         'medical', '#EB1700',
                         'hospital', '#762a83',
                         'park', '#006607',
                         'bank', '#01004D',
                         'field', '#B1FF8A',
                         'sub_building', '#762a83',
                         'worship', '#908AFF',
                         'athletics', '#64009E',
                         'school', '#9E0089',
                         'transit', '#FF9A00',
                         'monument', '#00E5FF',
                         '#999999'],
        'circle-opacity': 0.6
      };

      // When someone clicks a poi on the map, MapLibre runs this function.
      // e holds information about the click. e.features[0] is the feature (the poi) that was clicked.
      function onEachPoi(e) {
        // poi holds that feature's attributes, such as SERVICE_TYPE.
        const poi = e.features[0].properties;
        // Does this poi have a SERVICE_TYPE? If it does not, no popup opens.
        if (poi.PLACENAME) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(poi.PLACENAME);
          popup.addTo(map);
        }
      }

      // Add the source and the layer only after the map's style has loaded.
      map.on('load', function () {
        // A source holds the data. data: is the raw URL, so MapLibre fetches the file itself.
        // The pois appear when the whole file has arrived. Meanwhile, the browser goes on to map.addLayer() straight away.
        // attribution is the credit in the map's corner.
        map.addSource('poi', {
          type: 'geojson',
          data: url,
          attribution: 'Places of Interest: UBC POI, UBCGeodata'
        });

        // A layer says how to draw a source: here, a circle for each poi.
        // source: 'poi' is the name that addSource gave the source above.
        map.addLayer({
          id: 'poi-circles',
          type: 'circle',
          source: 'poi',
          paint: poiPaint
        });

        // When a circle of the layer 'poi-circles' is clicked, MapLibre runs onEachPoi.
        // Write onEachPoi without (). MapLibre runs it later, once for each click.
        map.on('click', 'poi-circles', onEachPoi);
      });
    </script>
  </body>
</html>
