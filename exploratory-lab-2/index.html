<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://rosenorth9638580.github.io/rosenorth9638580-web/exploratory-lab-2/maputnik_style.json',        // the file you downloaded from Maputnik
      center: [-127.5, 54.5],    // longitude, latitude
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
